[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "apsgraph"
version = "0.28.0"
description = "Read-only APS metadata graph and CodeGraph bridge tools"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]

[project.scripts]
apsgraph = "apsgraph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
apsgraph = ["workbench_static/*"]
