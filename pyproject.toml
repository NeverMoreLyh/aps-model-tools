[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aps-model-tools"
version = "0.3.0"
description = "Read-only APS metadata model index and analysis tools"
requires-python = ">=3.9"

[project.scripts]
aps-model = "aps_model_tools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
