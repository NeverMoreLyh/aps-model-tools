<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APSGraph 元数据查询工作台</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="layout">
  <nav id="sidebar">
    <div class="brand">
      <button id="nav-toggle" title="收起菜单">☰</button>
      <span>APSGraph<br><span class="brand-sub">元数据查询工作台</span></span>
    </div>
    <ul id="nav-list"></ul>
    <div id="sidebar-stats" class="sidebar-stats"></div>
  </nav>
  <main id="main">
    <section id="search-bar">
      <select id="dimension">
        <option value="">全部维度</option>
        <option value="id">id</option>
        <option value="fullid">fullId</option>
        <option value="longname">longname</option>
        <option value="desc">desc</option>
      </select>
      <select id="kind-select" class="hidden"></select>
      <input id="query" type="search" placeholder="输入关键字模糊搜索，留空浏览全部…">
      <button id="btn-search">查询</button>
      <button id="btn-clear" class="secondary">清空</button>
    </section>
    <section id="content">
      <button id="nav-open" class="hidden" title="展开菜单">☰ 菜单</button>
      <div id="results-pane">
        <div id="results-meta" class="results-meta"></div>
        <div id="results-body"></div>
        <div id="pagination" class="pagination">
          <button id="btn-prev" class="secondary">上一页</button>
          <span id="page-info"></span>
          <button id="btn-next" class="secondary">下一页</button>
        </div>
      </div>
      <div id="pane-resizer" title="拖拽调整宽度"></div>
      <aside id="detail-pane"></aside>
    </section>
  </main>
</div>
<script src="/mermaid.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
