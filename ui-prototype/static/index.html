<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>APSGraph · 元数据工作台</title>
<style>
:root{--bg:#0b1020;--panel:#121a2e;--panel2:#17223b;--line:#293653;--text:#e8eefc;--muted:#8e9bb7;--accent:#63d7c6;--accent2:#8aa8ff;--danger:#ff8b9e}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#0b1020,#111a30 55%,#0d1427);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif}button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--panel2);border-radius:7px;padding:8px 12px}button:hover{border-color:var(--accent)}.app{display:grid;grid-template-columns:250px 1fr;height:100vh}.side{border-right:1px solid var(--line);padding:24px 16px;background:#0c1326}.brand{font-weight:700;font-size:20px;letter-spacing:.3px;margin:0 8px 4px}.sub{color:var(--muted);font-size:12px;margin:0 8px 26px}.nav button{display:block;width:100%;text-align:left;border:0;background:transparent;margin:4px 0;color:#b9c5df}.nav button.active,.nav button:hover{background:#1c2a48;color:var(--accent)}.nav small{color:var(--muted);display:block;margin:22px 8px 8px}.main{overflow:auto;padding:28px 34px}.top{display:flex;justify-content:space-between;gap:20px;align-items:start}.eyebrow{color:var(--accent);font-size:12px;letter-spacing:1.5px;text-transform:uppercase}.title{font-size:28px;margin:4px 0}.desc{color:var(--muted);margin:0 0 24px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}.card{background:rgba(18,26,46,.82);border:1px solid var(--line);border-radius:11px;padding:16px}.metric{font-size:24px;font-weight:700}.label{color:var(--muted);font-size:12px}.toolbar{display:flex;gap:8px;margin-bottom:14px}.toolbar input{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:9px 12px}.toolbar select{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:9px}.body{display:grid;grid-template-columns:minmax(400px,1fr) minmax(440px,1.1fr);gap:16px}.table{padding:0;overflow:hidden}.table-head,.row{display:grid;grid-template-columns:125px 1fr 120px;gap:10px;padding:11px 14px;align-items:center}.table-head{color:var(--muted);font-size:12px;background:#182441}.row{border-top:1px solid rgba(41,54,83,.6);cursor:pointer}.row:hover,.row.selected{background:#1c2a48}.kind{color:var(--accent2);font-family:ui-monospace,monospace;font-size:12px}.id{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.path{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}.detail{min-height:590px}.detail h2{margin:0 0 4px;font-size:20px}.detail-meta{color:var(--muted);font-size:12px;word-break:break-all}.tabs{display:flex;gap:4px;margin:18px 0 12px;border-bottom:1px solid var(--line)}.tabs button{border:0;border-radius:0;background:transparent;color:var(--muted)}.tabs button.active{color:var(--accent);border-bottom:2px solid var(--accent)}pre{white-space:pre-wrap;word-break:break-word;background:#0a0f1d;border:1px solid var(--line);border-radius:8px;padding:14px;max-height:470px;overflow:auto;color:#cbd8f5;font:12px/1.6 ui-monospace,SFMono-Regular,monospace}.pill{display:inline-block;padding:2px 7px;border-radius:10px;background:#223253;color:var(--accent);font-size:11px}.empty{color:var(--muted);padding:50px;text-align:center}.children,.edges{display:grid;gap:8px}.child,.edge{padding:10px;border:1px solid var(--line);border-radius:7px;background:#101a30}.edge{font-size:12px}.edge b{color:var(--accent)}@media(max-width:1000px){.app{grid-template-columns:190px 1fr}.body{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}}
</style></head>
<body><div class="app"><aside class="side"><h1 class="brand">APSGraph</h1><p class="sub">Metadata Workbench · READ ONLY</p><nav class="nav"><button class="active" data-page="models">模型查询</button><button data-page="flowtran">FlowTran 工作台</button><button data-page="relations">关系与血缘</button><button data-page="files">模型文件</button><small>分析工具</small><button data-page="impact">影响分析</button><button data-page="exports">导出与报告</button></nav></aside><main class="main"><section class="top"><div><div class="eyebrow">APS METADATA EXPLORER</div><h2 class="title" id="page-title">结构化模型查询</h2><p class="desc" id="page-desc">从 APSGraph SQLite 索引检索模型、关系和原始 XML 证据。</p></div><button id="refresh">刷新索引</button></section><section class="stats" id="stats"></section><section class="toolbar"><input id="query" placeholder="搜索 full_id、raw_id、stable_id 或文件路径…"><select id="kind"><option value="">全部模型类型</option></select><button id="search">查询</button></section><section class="body"><section class="card table"><div class="table-head"><span>类型</span><span>模型 ID</span><span>来源文件</span></div><div id="model-list"><div class="empty">加载中…</div></div></section><section class="card detail" id="detail"><div class="empty">选择左侧模型查看详情</div></section></section></main></div>
<script>
const $=s=>document.querySelector(s), state={selected:null,tab:'overview'};
async function api(url){const r=await fetch(url);const d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function loadStats(){const [s,k]=await Promise.all([api('/api/stats'),api('/api/kinds')]);$('#stats').innerHTML=Object.entries({files:s.files,parsed:s.parsed,nodes:s.nodes,edges:s.edges,unresolved:s.unresolved}).map(([k,v])=>`<div class="card"><div class="metric">${v.toLocaleString()}</div><div class="label">${k}</div></div>`).join('');$('#kind').innerHTML='<option value="">全部模型类型</option>'+k.map(x=>`<option>${esc(x.kind)}</option>`).join('')}
async function loadModels(){const q=$('#query').value.trim(),kind=$('#kind').value;const params=new URLSearchParams({limit:'300'});if(q)params.set('q',q);if(kind)params.set('kind',kind);const rows=await api('/api/models?'+params);$('#model-list').innerHTML=rows.length?rows.map(x=>`<div class="row ${state.selected===x.stable_id?'selected':''}" data-id="${encodeURIComponent(x.stable_id)}"><span class="kind">${esc(x.kind)}</span><span class="id" title="${esc(x.full_id||x.stable_id)}">${esc(x.full_id||x.raw_id||x.stable_id)}</span><span class="path" title="${esc(x.file_path)}">${esc(x.file_path)}</span></div>`).join(''):'<div class="empty">没有匹配模型</div>';document.querySelectorAll('.row[data-id]').forEach(x=>x.onclick=()=>loadDetail(decodeURIComponent(x.dataset.id)))}
function tabs(){return `<div class="tabs"><button class="${state.tab==='overview'?'active':''}" data-tab="overview">基本信息</button><button class="${state.tab==='children'?'active':''}" data-tab="children">结构节点</button><button class="${state.tab==='relations'?'active':''}" data-tab="relations">关系与血缘</button><button class="${state.tab==='xml'?'active':''}" data-tab="xml">原始 XML</button><button class="${state.tab==='semantic'?'active':''}" data-tab="semantic">语义分区</button></div>`}
async function loadDetail(id){state.selected=id;state.tab='overview';const x=await api('/api/models/'+encodeURIComponent(id));renderDetail(x);await loadModels()}
function renderDetail(x){let content;if(state.tab==='overview')content=`<h3>属性 JSON</h3><pre>${esc(JSON.stringify(x.properties||{},null,2))}</pre>`;if(state.tab==='children')content=`<div class="children">${x.children.length?x.children.map(c=>`<div class="child"><span class="pill">${esc(c.kind)}</span> ${esc(c.full_id||c.raw_id||c.stable_id)}<div class="detail-meta">${esc(c.xml_tag||'')}</div></div>`).join(''):'<div class="empty">没有直接子节点</div>'}</div>`;if(state.tab==='relations')content=`<div class="edges">${x.edges.length?x.edges.map(e=>`<div class="edge"><b>${esc(e.relation_kind)}</b> · ${esc(e.from_id)} → ${esc(e.to_id||e.unresolved_target||'UNRESOLVED')}<div class="detail-meta">证据：${esc(e.evidence_path||'')} · ${esc(e.confidence||'')}</div></div>`).join(''):'<div class="empty">没有关系</div>'}</div>`;if(state.tab==='xml')content='<div class="empty">加载 XML…</div>';if(state.tab==='semantic'){const sec=x.sections||{};content=['interfaces','mappings','orchestration'].map(k=>`<h3>${k==='interfaces'?'接口定义':k==='mappings'?'数据映射':'流程编排'}</h3><div class="children">${(sec[k]||[]).map(c=>`<div class="child"><span class="pill">${esc(c.kind)}</span> ${esc(c.full_id||c.raw_id||c.stable_id)}<div class="detail-meta">${esc(c.xml_tag||'')}</div></div>`).join('')||'<div class="empty">暂无节点</div>'}</div>`).join('')}$('#detail').innerHTML=`<h2>${esc(x.full_id||x.raw_id||x.stable_id)}</h2><div class="detail-meta"><span class="pill">${esc(x.kind)}</span> · ${esc(x.file_path)} · tag=${esc(x.xml_tag)}</div>${tabs()}<div id="tab-content">${content}</div>`;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=async()=>{state.tab=b.dataset.tab;if(state.tab==='xml'){const z=await api('/api/xml/'+encodeURIComponent(x.stable_id));$('#tab-content').innerHTML=z.available?`<div class="detail-meta">${esc(z.path)}</div><pre>${esc(z.content)}</pre>`:`<div class="empty">${esc(z.reason)}</div>`}else renderDetail(x)})}
async function refresh(){try{await loadStats();await loadModels()}catch(e){$('#model-list').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
$('#search').onclick=refresh;$('#refresh').onclick=refresh;$('#query').onkeydown=e=>{if(e.key==='Enter')refresh()};$('#kind').onchange=refresh;document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-page]').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(b.dataset.page==='flowtran'){$('#page-title').textContent='FlowTran 工作台';$('#page-desc').textContent='基本信息、接口定义、数据映射、流程编排与原始 XML。';$('#query').value='';$('#kind').value='FLOWTRAN';refresh()}else{$('#page-title').textContent='结构化模型查询';$('#page-desc').textContent='从 APSGraph SQLite 索引检索模型、关系和原始 XML 证据。';$('#kind').value='';refresh()}});refresh();
</script></body></html>
